      <rect x="246" y="243" width="54" height="35" rx="9"/><rect x="246" y="284" width="54" height="35" rx="9"/><rect x="184" y="325" width="53" height="35" rx="9"/><rect x="246" y="325" width="54" height="35" rx="9"/>
    </g>
    <g fill="#2f47b5"><text x="273" y="266">÷</text><text x="273" y="307">×</text><text x="210" y="348">=</text><text x="273" y="348">+</text></g>
  </g>
  <text x="350" y="177" fill="#23242d" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Historial</text>
  <rect x="539" y="160" width="42" height="21" rx="7" fill="#fff" stroke="#c4c8d6"/>
  <text x="560" y="174" fill="#2f47b5" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Vaciar</text>
  <path d="M348 191h230" stroke="#dcdfe8"/>
  <g font-family="monospace" font-size="12">
    <rect x="348" y="201" width="230" height="39" rx="9" fill="#f3f4f8"/>
    <text x="360" y="225" fill="#23242d">7 + 5</text><text x="566" y="225" fill="#2f47b5" font-weight="700" text-anchor="end">= 12</text>
    <rect x="348" y="247" width="230" height="39" rx="9" fill="#f3f4f8"/>
    <text x="360" y="271" fill="#23242d">9 × 4</text><text x="566" y="271" fill="#2f47b5" font-weight="700" text-anchor="end">= 36</text>
