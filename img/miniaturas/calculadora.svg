<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="hero" x2="1" y2="1">
      <stop stop-color="#1e1d27"/>
      <stop offset="1" stop-color="#34345a"/>
    </linearGradient>
    <linearGradient id="screen" x2="1" y2="1">
      <stop stop-color="#171722"/>
      <stop offset="1" stop-color="#25243a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#171626" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#f3f4f8"/>
  <rect width="640" height="36" fill="#1e1d27"/>
  <rect x="22" y="12" width="13" height="13" rx="4" fill="#8fa2ff"/>
  <rect x="42" y="15" width="110" height="6" rx="3" fill="#e7e8f1" opacity=".9"/>
  <rect y="36" width="640" height="88" fill="url(#hero)"/>
  <text x="320" y="78" fill="#fff" font-family="system-ui, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Calcula a tu manera</text>
  <text x="320" y="101" fill="#c9cbe0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Operaciones sencillas, resultados al instante</text>
