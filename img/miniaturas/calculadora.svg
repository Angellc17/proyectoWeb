    <rect x="331" y="149" width="264" height="223" rx="16" fill="#fff" stroke="#dcdfe8"/>
  </g>
  <text x="62" y="169" fill="#5b5e70" font-family="system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">CALCULADORA · BÁSICA</text>
  <rect x="60" y="179" width="240" height="55" rx="11" fill="url(#screen)"/>
  <text x="282" y="217" fill="#f7f8ff" font-family="monospace" font-size="28" font-weight="700" text-anchor="end">12</text>
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <g fill="#f3f4f8" stroke="#dcdfe8">
      <rect x="60" y="243" width="53" height="35" rx="9"/><rect x="122" y="243" width="53" height="35" rx="9"/><rect x="184" y="243" width="53" height="35" rx="9"/>
      <rect x="60" y="284" width="53" height="35" rx="9"/><rect x="122" y="284" width="53" height="35" rx="9"/><rect x="184" y="284" width="53" height="35" rx="9"/>
      <rect x="60" y="325" width="53" height="35" rx="9"/><rect x="122" y="325" width="53" height="35" rx="9"/>
    </g>
