      <text x="86" y="266">7</text><text x="148" y="266">8</text><text x="210" y="266">9</text>
      <text x="86" y="307">4</text><text x="148" y="307">5</text><text x="210" y="307">6</text>
      <text x="86" y="348">1</text><text x="148" y="348">2</text>
    </g>
