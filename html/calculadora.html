<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <link rel="stylesheet" href="../css/estilo.css">
        <link rel="stylesheet" href="../css/calculadora.css">
        <script src="../js/menu.js" defer></script>
        <script src="../js/calculadora.js" defer></script>
        <link rel="stylesheet" href="../css/sitio-compartido.css">
        <script src="../js/portafolio.js" defer></script>
    </head>
    <body class="sitio" data-theme="dark">
        <header class="cabecera">
            <h1>Calculadora</h1>
            <nav class="menu" aria-label="Principal">
                <a href="../index.html">Inicio</a>
                <a href="horario.html">Horario</a>
                <a href="formulario.html">Formulario</a>
                <div class="desplegable">
                    <button type="button" class="menu-boton activo" aria-expanded="false" aria-haspopup="true">JS</button>
                    <div class="submenu">
                            <a href="inicio_js.html">Inicio JS</a>
                            <a href="calculadora.html" aria-current="page">Calculadora</a>
                            <a href="juego.html">Piedra, papel o tijera</a>
                    </div>
                </div>
                <div class="desplegable">
                    <button type="button" class="menu-boton" aria-expanded="false" aria-haspopup="true">Actividades complementarias</button>
                    <div class="submenu">
                            <a href="ejercicio1.html">Ejercicio 1</a>
                            <a href="ejercicio2.html">Ejercicio 2</a>
                            <a href="ejercicio3.html">Ejercicio 3</a>
                            <a href="ejercicio4.html">Ejercicio 4</a>
                            <a href="ejercicio5.html">Ejercicio 5</a>
                            <a href="ejercicio6.html">Ejercicio 6</a>
                            <a href="ejercicio7.html">Ejercicio 7</a>
                            <a href="ejercicio8.html">Ejercicio 8</a>
                            <a href="ejercicio9_pagina1.html">Ejercicio 9</a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="contenido">
            <section class="calculadora" aria-label="Calculadora">
                <input type="text" id="pantalla" value="0" readonly aria-label="Pantalla">
                <div class="teclas">
                    <button type="button" class="tecla" onclick="escribir('7')">7</button>
                    <button type="button" class="tecla" onclick="escribir('8')">8</button>
                    <button type="button" class="tecla" onclick="escribir('9')">9</button>
                    <button type="button" class="tecla op" onclick="escribir('/')" aria-label="dividir">÷</button>
                    <button type="button" class="tecla" onclick="escribir('4')">4</button>
                    <button type="button" class="tecla" onclick="escribir('5')">5</button>
                    <button type="button" class="tecla" onclick="escribir('6')">6</button>
                    <button type="button" class="tecla op" onclick="escribir('*')" aria-label="multiplicar">×</button>
                    <button type="button" class="tecla" onclick="escribir('1')">1</button>
                    <button type="button" class="tecla" onclick="escribir('2')">2</button>
                    <button type="button" class="tecla" onclick="escribir('3')">3</button>
                    <button type="button" class="tecla op" onclick="escribir('-')" aria-label="restar">−</button>
                    <button type="button" class="tecla" onclick="escribir('.')">.</button>
                    <button type="button" class="tecla" onclick="escribir('0')">0</button>
                    <button type="button" class="tecla igual" onclick="resolver()" aria-label="igual">=</button>
                    <button type="button" class="tecla op" onclick="escribir('+')" aria-label="sumar">+</button>
                    <button type="button" class="tecla borrar" onclick="borrar()">C</button>
                </div>
            </section>
        </main>

        <footer class="pie">
            <p>CIFP Virgen de Gracia</p>
            <p>Contacto: <a href="mailto:correodeprueba@gmail.com">correodeprueba@gmail.com</a></p>
        </footer>
    </body>
</html>
