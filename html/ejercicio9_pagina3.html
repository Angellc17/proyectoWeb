<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Usuario</title>
        <link rel="stylesheet" href="../css/estilo_ejercicio9_pag3.css">
    </head>
    <body>
        <main>
            <form action="ejercicio9_pagina4.html">
                <fieldset class="formulario">
                    <legend>Datos del usuario</legend>
                    <!-- Nombre -->
                    <label for="nombre">Nombre*:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required>
                    <br>
                    <!-- Apellidos -->
                    <label for="apellidos">Apellidos*:</label>
                    <input
                        type="text"
                        id="apellidos"
                        name="apellidos"
                        required>
                    <br>
                    <!-- Fecha de nacimiento -->
                    <label for="fecha">Fecha de nacimiento*:</label>
                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required>
                    <br>
                    <!-- Email -->
                    <label for="email">Email*:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                    <br>
                    <!-- Contraseña -->
                    <label for="password">Contraseña*:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required>
                </fieldset>
                <fieldset class="botones">
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Restablecer">
                </fieldset>
            </form>
        </main>
    </body>
</html>
